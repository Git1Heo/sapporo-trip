 $('#cover-image').hidden=false;$('#cover-image').src=d.cover;$('#cover-image').alt=d.caption;$('#cover-image').onerror=()=>imageError($('#cover-image'));$('#cover-eyebrow').textContent='CHAPTER 0'+(i+1)+' / '+d.en;$('#cover-title').textContent=d.title;$('#cover-credit').textContent=d.caption;
 $('#timeline').innerHTML=d.stops.map((s,k)=>{
  const box=document.createElement('div');box.innerHTML=s.body;const p=box.querySelector('p');const brief=s.showDetailsInline?s.body:(p?p.outerHTML:'');if(p)p.remove();const rest=s.showDetailsInline?'':box.innerHTML.trim();
  return '<section class="stop-step" data-step="'+k+'"><div class="stop-banner"><button class="sequence-number" data-pin="'+s.pin+'" aria-label="'+s.pin+'번 일정 지도 보기">'+String(s.pin).padStart(2,'0')+'</button><div class="stop-banner-text"><strong>'+(dayIndex+1)+'일차 · '+s.pin+'번 일정</strong><time>'+esc(s.time)+'</time></div></div>'+arrivalMarkup(s)+'<article class="stop" data-pin="'+s.pin+'" id="stop-'+k+'"><time class="time">'+esc(s.time)+'</time><div class="stop-inner">'+photosMarkup(s)+'<div class="cardtext"><div class="sequence-heading"><h3>'+esc(s.title)+'</h3></div>'+brief+bookingMarkup(s)+dinnerMarkup(k)+'<div class="card-actions">'+(s.pin?'<button class="map-link" data-pin="'+s.pin+'">⌖ 지도에서 보기 <span aria-hidden="true">↗</span></button>':'<span></span>')+(rest?'<button class="more-button" data-label="'+esc(s.moreLabel||'자세히 보기')+'" aria-expanded="false" aria-controls="details-'+k+'">'+esc(s.moreLabel||'자세히 보기')+' ＋</button>':'')+'</div>'+(rest?'<div class="details-body" id="details-'+k+'" hidden>'+rest+'</div>':'')+'</div></div></article></section>';
 }).join('');
 $$('[data-dinner]').forEach(b=>b.onclick=()=>chooseDinner(Number(b.dataset.dinner)));
 $$('.card-photo img').forEach(img=>img.onerror=()=>imageError(img));
 $$('.map-link,.sequence-number').forEach(b=>b.onclick=()=>selectPin(Number(b.dataset.pin)-1,true));
 $$('.more-button').forEach(b=>b.onclick=()=>{const on=b.getAttribute('aria-expanded')!=='true';b.setAttribute('aria-expanded',String(on));b.textContent=on?'접기 −':b.dataset.label+' ＋';document.getElementById(b.getAttribute('aria-controls')).hidden=!on;});
 $('#map-select').innerHTML=r.map((s,k)=>'<option value="'+k+'">'+(k+1)+'. '+esc(s.n)+'</option>').join('');$('#map-select').onchange=e=>selectPin(Number(e.target.value));
 $('#map-chips').innerHTML=r.map((s,k)=>'<button aria-pressed="false">'+(k+1)+' '+esc(s.n)+'</button>').join('');$$('#map-chips button').forEach((b,k)=>b.onclick=()=>selectPin(k));
 $('#prev-day').disabled=i===0;$('#next-day').disabled=i===4;
 updateMap();selectPin(0);enhanceDay();$('.journey').scrollTop=0;
}
$('.daytabs').innerHTML=CONTENT.map((d,i)=>'<button role="tab" id="daytab-'+i+'" aria-controls="journey" aria-selected="false"><small>DAY '+(i+1)+' · '+d.date+'</small><b>'+esc(['노보리베츠','삿포로 시내','마루야마·모이와야마','삿포로 맛집','귀국'][i])+'</b></button>').join('');
function changeDay(i){if(document.body.classList.contains('mapmode')){scheduleScroll=0;schedulePin=-1;}renderDay(i);if(media.matches){const tab=$('.daytabs button[aria-selected=true]');$('.daytabs').scrollTo({left:tab.offsetLeft-$('.daytabs').clientWidth/2+tab.offsetWidth/2,behavior:'smooth'});window.scrollTo({top:0,behavior:'instant'});}else window.scrollTo({top:0,behavior:'smooth'});}
$$('.daytabs button').forEach((b,i)=>{b.onclick=()=>changeDay(i);b.onkeydown=e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const n=e.key==='Home'?0:e.key==='End'?4:(i+(e.key==='ArrowRight'?1:4))%5;changeDay(n);$$('.daytabs button')[n].focus();};});
$('#prev-day').onclick=()=>changeDay(Math.max(0,dayIndex-1));$('#next-day').onclick=()=>changeDay(Math.min(4,dayIndex+1));
$$('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));
$('#reset-map').onclick=()=>{if(!map)return;if(activeLine){map.removeLayer(activeLine);activeLine=null;}routeLines.forEach(line=>line.setStyle({opacity:.45}));fitOverview();};
media.addEventListener('change',()=>{if(map)requestAnimationFrame(()=>map.invalidateSize({pan:false}));});
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(!a)return;const id=a.getAttribute('href').slice(1);if(!id)return;const dest=document.getElementById(id);if(dest&&dest.tagName==='DETAILS')dest.open=true;});

function syncQuickStops(){
 $$('#quick-stops button').forEach((b,k)=>{if(k===selectedPin)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current');});
 $$('.sequence-number').forEach((b,k)=>b.setAttribute('aria-pressed',String(k===selectedPin)));
}
let bookingNoticeTimer;
function bookingNotice(message){
 let notice=document.querySelector('.notice-toast');
 if(!notice){notice=document.createElement('div');notice.className='notice-toast';notice.setAttribute('role','status');notice.setAttribute('aria-live','polite');document.body.appendChild(notice);}
 notice.textContent=message;clearTimeout(bookingNoticeTimer);bookingNoticeTimer=setTimeout(()=>{notice.textContent='';},3000);
}
function enhanceBookings(){
 $$('.booking-grid>div').forEach(row=>{
  if(row.querySelector('button'))return;
  const value=row.querySelector('dd'),label=row.querySelector('dt').textContent;
  const button=document.createElement('button');button.type='button';button.className='booking-copy';button.textContent='복사';button.setAttribute('aria-label',label+' 복사');
  button.onclick=async()=>{try{
   if(!navigator.clipboard?.writeText)throw new Error('Clipboard unavailable');
   await navigator.clipboard.writeText(value.textContent);bookingNotice(label+'를 복사했습니다.');
  }catch(e){const selection=window.getSelection(),range=document.createRange();range.selectNodeContents(value);selection.removeAllRanges();selection.addRange(range);bookingNotice('선택된 내용을 길게 누르거나 Ctrl+C로 복사해 주세요.');}};
  row.appendChild(button);
 });
}
function enhanceDay(){
 enhanceBookings();
 $('#journey').setAttribute('role','tabpanel');$('#journey').setAttribute('aria-labelledby','daytab-'+dayIndex);
 $('#quick-stops').innerHTML=CONTENT[dayIndex].stops.map((s,k)=>'<button type="button" aria-label="'+(k+1)+'번 '+esc(s.title)+' 일정으로 이동"><b>'+(k+1)+'</b><time>'+esc(s.time)+'</time><span>'+esc(s.title)+'</span></button>').join('');
 $$('#quick-stops button').forEach((b,k)=>b.onclick=()=>{selectPin(k,false);setView('schedule');requestAnimationFrame(()=>{const el=$('#stop-'+k);scrollToStop(k);el.closest('.stop-step').querySelector('.sequence-number').focus({preventScroll:true});});});
 $$('.card-photo img').forEach((img,k)=>{const photo=figurePhoto(img.closest('figure'));img.decoding='async';const b=document.createElement('button');b.type='button';b.className='photo-expand';b.setAttribute('aria-label',photo.imageCaption+' 사진 크게 보기');img.parentNode.insertBefore(b,img);b.appendChild(img);b.onclick=()=>openPhoto(photo,img.currentSrc||img.src);});
 syncQuickStops();
}
function openPhoto(s,url){
 $('#photo-title').textContent=s.title;$('#large-photo').src=url;$('#large-photo').alt=s.imageCaption;
 $('#large-credit').replaceChildren(document.createTextNode(s.imageCaption+' · '));
 const a=document.createElement('a');a.href=s.photoSource;a.textContent=s.photoCredit;a.target='_blank';a.rel='noopener';$('#large-credit').appendChild(a);
 if(s.photoLicense){const l=document.createElement('a');l.href=s.photoLicenseUrl;l.textContent=s.photoLicense;l.target='_blank';l.rel='noopener';$('#large-credit').append(' · ',l);}
 $('#photo-dialog').showModal();
}
function installEnhancements(){
 let scrollTimer;
 window.addEventListener('scroll',()=>{
  if(document.body.classList.contains('mapmode')||Date.now()<scrollTrackingUntil)return;
  clearTimeout(scrollTimer);scrollTimer=setTimeout(()=>{
   if(document.body.classList.contains('mapmode')||Date.now()<scrollTrackingUntil)return;
   const top=media.matches?$('.daytabs').offsetHeight+20:24;
   const steps=$$('.stop-step');if(!steps.length)return;
   // Keep the current card selected until its bottom passes the reading line.
   const current=steps.find(el=>el.getBoundingClientRect().bottom>top)||steps.at(-1);
   const index=Number(current.dataset.step);if(index!==selectedPin)selectPin(index);
  },140);
 },{passive:true});
 let placeholder=null,returnFocus=null;
 $('#expand-map').onclick=()=>{
   returnFocus=document.activeElement;placeholder=document.createComment('map position');$('#map-panel').before(placeholder);
   $('#map-dialog').appendChild($('#map-panel'));$('#map-dialog').showModal();
   requestAnimationFrame(()=>{if(map){map.invalidateSize({pan:false});if($('#reset-map').getAttribute('aria-pressed')==='true')fitOverview();else fitSelected();}});
 };
 $('#map-dialog').addEventListener('close',()=>{if(placeholder){placeholder.replaceWith($('#map-panel'));placeholder=null;}requestAnimationFrame(()=>{if(map)map.invalidateSize({pan:false});returnFocus?.focus({preventScroll:true});});});
 $$('[data-close-dialog]').forEach(b=>b.onclick=()=>document.getElementById(b.dataset.closeDialog).close());
 $('#map-dialog').addEventListener('click',e=>{if(e.target.closest('#show-stop'))$('#map-dialog').close();});
 const overview=$('#reset-map');overview.onclick=()=>{
   setProvider('route');
   if(!map)return;if(activeLine){map.removeLayer(activeLine);activeLine=null;}
   routeLines.forEach(l=>l.setStyle({opacity:.45}));markers.forEach(m=>{m.setZIndexOffset(0);m.getElement()?.querySelector('.pin')?.classList.remove('active');});
   overview.setAttribute('aria-pressed','true');
   $('#map-stop').innerHTML='<span class="label">DAY '+(dayIndex+1)+' / 전체 경로</span><h3>'+esc(CONTENT[dayIndex].region)+'</h3><p>'+route().length+'개 일정의 방문 순서입니다. 아래 번호를 선택하면 직전 일정부터의 구간을 확인할 수 있어요.</p>';
   $$('#map-chips button').forEach(b=>b.setAttribute('aria-pressed','false'));
   fitOverview();
 };
 $('#large-photo').onerror=()=>{const message=document.createElement('span');message.textContent=' 사진을 불러오지 못했습니다. 출처 링크에서 확인해 주세요.';$('#large-credit').appendChild(message);};
}

initMap();renderDay(0);installEnhancements();setProvider('route');$$('[data-provider]').forEach(b=>b.onclick=()=>setProvider(b.dataset.provider));
